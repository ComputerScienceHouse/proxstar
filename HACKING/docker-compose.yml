services:
  proxstar-redis:
    image: docker.io/library/redis:alpine
    networks:
      - proxstar
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: ../proxstar
          target: /opt/proxstar/proxstar
          ignore:
            - __pycache__

  proxstar-postgres:
    build:
      context: ./proxstar-postgres
    environment:
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - proxstar-postgres:/var/lib/postgresql/data:Z
    networks:
      - proxstar
    restart: always

  proxstar-rq-scheduler:
    build:
      context: ..
    env_file: .env
    entrypoint: ./start_scheduler.sh
    networks:
      - proxstar
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: ../proxstar
          target: /opt/proxstar/proxstar
          ignore:
            - __pycache__

  proxstar-rq:
    build:
      context: ..
    env_file: .env
    entrypoint: ./start_worker.sh
    networks:
      - proxstar
    restart: always
    develop:
      watch:
        - action: sync+restart
          path: ../proxstar
          target: /opt/proxstar/proxstar
          ignore:
            - __pycache__


  proxstar:
    build:
      context: ..
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file: .env
    entrypoint: ["gunicorn", "proxstar:app", "--bind=0.0.0.0:8080"]
    networks:
      - proxstar
networks:
  proxstar:

volumes:
  proxstar-postgres:
